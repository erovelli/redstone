<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="description" content="A catalogue of tested redstone contraptions on a 3D tick engine, with a browser test bench.">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Redstone kit: catalogue</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:ital,wght@0,400;0,500;1,400&family=IBM+Plex+Sans+Condensed:wght@400;600&family=Pixelify+Sans:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{
  --b:24px; --t:17px;
  --bg:#f3f0e6; --surface:#fbf9f3; --edge:#2a251f; --line:#d9d3c3; --text:#2a251f; --muted:#6b6355; --heading:#1a1612; --shadow:#2a251f;
  --floor:#e2dccd; --floor-line:#d6cfbe; --cavity:#bdb6a6; --accent:#b8200e; --accent-soft:#f4d9d2;
  --display:"Pixelify Sans","Courier New",monospace; --mono:"IBM Plex Mono",ui-monospace,Menlo,monospace; --cond:"IBM Plex Sans Condensed","Arial Narrow",sans-serif;
  color-scheme:light; box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#17161a; --surface:#1f1e23; --edge:#0a0a0c; --line:#34323a; --text:#e8e3d8; --muted:#9a9488; --heading:#fff6e8; --shadow:#000;
  --floor:#2a2930; --floor-line:#313038; --cavity:#121215; --accent:#ff5a44; --accent-soft:#3a1a16; color-scheme:dark; } }
:root[data-theme="dark"]{
  --bg:#17161a; --surface:#1f1e23; --edge:#0a0a0c; --line:#34323a; --text:#e8e3d8; --muted:#9a9488; --heading:#fff6e8; --shadow:#000;
  --floor:#2a2930; --floor-line:#313038; --cavity:#121215; --accent:#ff5a44; --accent-soft:#3a1a16; color-scheme:dark; }
html{ scroll-padding-top:calc(env(safe-area-inset-top,0px) + 12px); scroll-behavior:smooth; }
@media (prefers-reduced-motion: reduce){ html{ scroll-behavior:auto; } }
*,*::before,*::after{ box-sizing:inherit; }
body{ margin:0; background:var(--bg); color:var(--text); font-family:var(--mono); font-size:15px; line-height:1.6; transition:background-color .25s,color .25s; }
a{ color:var(--accent); text-decoration-thickness:1px; text-underline-offset:3px; }
a:hover{ text-decoration-thickness:2px; }
:focus-visible{ outline:2px dashed var(--accent); outline-offset:3px; }
.skip{ position:absolute; left:-999px; } .skip:focus{ left:12px; top:12px; background:var(--surface); padding:6px 10px; z-index:10; }
.wrap{ max-width:820px; margin:0 auto; padding:16px 16px 48px; }
/* header */
.top{ display:flex; justify-content:space-between; align-items:center; gap:12px; padding-bottom:14px; border-bottom:1px solid var(--line); }
.brand{ display:flex; align-items:center; gap:8px; color:var(--heading); text-decoration:none; font-weight:500; }
.brand i{ font-style:normal; font-family:var(--display); font-weight:700; background:var(--heading); color:var(--bg); padding:1px 5px; font-size:.85rem; }
nav{ display:flex; gap:14px; font-size:.85rem; } nav a{ color:var(--muted); text-decoration:none; } nav a:hover{ color:var(--accent); }
.rig{ display:flex; align-items:center; gap:6px; font-size:.72rem; color:var(--muted); }
/* type */
h1{ font-family:var(--display); font-weight:700; color:var(--heading); font-size:clamp(2.4rem,9vw,4.4rem); line-height:1; margin:0; letter-spacing:-.01em; }
h1 span{ color:var(--muted); font-weight:500; }
h1 span::before{ content:"/"; color:var(--accent); margin:0 .12em 0 .05em; }
.lede{ font-size:1.02rem; max-width:62ch; margin:18px 0 0; }
.btn{ display:inline-block; font-family:var(--mono); font-size:.88rem; padding:7px 12px; border:2px solid var(--edge); background:var(--surface); color:var(--heading); text-decoration:none; box-shadow:3px 3px 0 var(--shadow); }
.btn:hover{ transform:translate(-1px,-1px); box-shadow:4px 4px 0 var(--shadow); text-decoration:none; }
.btn.primary{ background:var(--accent); color:#fff; border-color:var(--edge); }
section{ margin:54px 0 0; }
.label{ font-family:var(--mono); font-size:.78rem; color:var(--muted); text-transform:lowercase; margin:0 0 6px; }
.label::before{ content:"/ "; color:var(--accent); }
h2{ font-family:var(--display); font-weight:700; font-size:clamp(1.5rem,5vw,2rem); line-height:1.1; color:var(--heading); margin:0 0 10px; }
h3{ font-family:var(--display); font-weight:500; font-size:1.25rem; line-height:1.15; margin:0; color:var(--heading); }
h3 a{ color:inherit; text-decoration:none; } h3 a:hover{ color:var(--accent); }
.panel{ background:var(--surface); border:2px solid var(--edge); box-shadow:5px 5px 0 var(--shadow); padding:14px; }
.kicker{ font-size:.76rem; color:var(--muted); margin:0 0 4px; }
details.how{ margin:12px 0 0; font-size:.8rem; color:var(--muted); }
details.how summary{ cursor:pointer; list-style:none; display:inline-flex; gap:6px; align-items:center; }
details.how summary::-webkit-details-marker{ display:none; }
details.how summary::before{ content:"\25B8"; color:var(--accent); transition:transform .15s; }
details.how[open] summary::before{ transform:rotate(90deg); }
details.how p, details.how ol{ margin:8px 0 0; max-width:66ch; }
details.how ol{ padding-left:1.3em; }
/* stages */
.measure{ width:100%; height:0; }
.stage{ position:relative; margin:0 auto; }
.stage canvas{ position:absolute; left:0; top:0; image-rendering:pixelated; pointer-events:none; z-index:2; }
.hit{ position:absolute; z-index:3; width:var(--b); height:var(--b); padding:0; margin:0; border:0; background:transparent; cursor:pointer; }
.hit:hover{ outline:2px solid var(--accent); outline-offset:-2px; }
.layer{ position:absolute; z-index:1; }
.tag{ position:absolute; z-index:4; font-family:var(--mono); font-size:calc(var(--b) * .45); color:var(--muted); white-space:nowrap; pointer-events:none; display:flex; align-items:center; height:var(--b); }
.controls{ display:flex; flex-wrap:wrap; gap:6px 18px; margin:0 0 10px; }
.peel{ display:flex; align-items:center; gap:8px; font-size:.76rem; color:var(--muted); }
.peel input{ width:120px; accent-color:var(--accent); } .peel span{ min-width:12ch; }
.plaque{ background:#1d1a22; color:#efe6d4; display:flex; align-items:flex-end; padding:0 calc(var(--b)*.35) calc(var(--b)*.1); font-family:var(--cond); font-size:calc(var(--b)*.66); line-height:1.08; box-shadow:inset 0 0 0 2px #2c2833; }
.plaque b{ color:#ffd56e; font-weight:600; margin-right:.35em; }
footer{ margin-top:60px; padding-top:16px; border-top:1px solid var(--line); font-size:.78rem; color:var(--muted); display:flex; flex-wrap:wrap; justify-content:space-between; gap:8px 18px; }
footer nav{ font-size:.78rem; }

.wrap{ max-width:1180px; }
.top{ background:var(--bg); padding-top:10px; }
.launch{ display:block; margin:14px 0 0; padding:8px 0; border-bottom:1px solid var(--line); overflow:clip; }
.launch-scroll{ overflow:visible; }
/* The wall is drawn at real block scale: one block per barrel, piston or slime block. */
.launch #launch-stage{ position:relative; margin:0 auto; height:var(--closed); overflow:hidden; transition:height .28s ease; }
.launch #launch-stage.open{ height:var(--open); }
#launch-stage canvas{ position:absolute; left:0; top:0; image-rendering:pixelated; pointer-events:none; }
/* Labels are small versions of the hidden plaque's text bands. */
.pad{ position:absolute; z-index:2; display:block; text-decoration:none; }
.pad span{ position:absolute; left:50%; top:25%; transform:translate(-50%,-50%); display:block; padding:0 calc(var(--b) * .16); line-height:calc(var(--b) * .62); background:#1d1a22; box-shadow:inset 0 0 0 2px #2c2833; font-family:var(--cond); font-weight:400; font-size:clamp(9px, calc(var(--b) * .4), 17px); color:#efe6d4; white-space:nowrap; }
.pad::after{ content:''; position:absolute; left:33.33%; top:50%; width:33.33%; height:50%; box-sizing:border-box; }
.pad:hover::after{ background:rgba(255,255,255,.14); }
.pad:hover span, .pad[aria-current="page"] span{ color:#ffd56e; font-weight:600; }
.pad.launching::after, .pad[aria-current="page"]::after{ outline:2px solid var(--accent); outline-offset:1px; }
.pad:focus-visible{ outline:none; } .pad:focus-visible::after{ outline:2px dashed var(--accent); outline-offset:2px; }
@media(prefers-reduced-motion:reduce){ .launch #launch-stage{ transition:none; } }
.launch-hint{ margin:6px 0 8px; text-align:center; font-size:.7rem; color:var(--muted); }
#pearl-sky{ position:fixed; left:0; top:0; z-index:90; pointer-events:none; image-rendering:pixelated; }
#terrain{ position:fixed; inset:0; z-index:100; display:flex; align-items:center; justify-content:center; background-color:#211810; background-size:64px 64px; image-rendering:pixelated; box-shadow:inset 0 0 0 100vmax rgba(0,0,0,.62); }
#terrain[hidden]{ display:none; }
#terrain p{ margin:0 0 12vh; font-family:var(--display); font-weight:500; font-size:26px; color:#fff; text-shadow:3px 3px 0 #3f3f3f; }
.menu{ display:none; font:inherit; font-size:.8rem; border:2px solid var(--edge); background:var(--surface); color:var(--text); padding:3px 10px; cursor:pointer; }
.layout{ display:grid; grid-template-columns:230px minmax(0,1fr); gap:34px; margin-top:22px; }
#side{ position:sticky; top:64px; align-self:start; max-height:calc(100vh - 80px); overflow:auto; font-size:.82rem; padding-right:6px; }
#side nav{ display:flex; flex-direction:column; gap:1px; margin-top:10px; }
#side nav a{ color:var(--text); text-decoration:none; padding:3px 8px; border-left:2px solid transparent; display:flex; justify-content:space-between; align-items:center; gap:8px; }
#side [hidden]{ display:none; }
#side nav a:hover{ color:var(--accent); }
#side nav a.active{ border-left-color:var(--accent); background:var(--surface); color:var(--heading); }
#side .group{ margin:14px 0 2px; } #side .group a{ font-size:.72rem; color:var(--muted); text-transform:lowercase; padding-left:8px; }
#side .group a::before{ content:"/ "; color:var(--accent); }
#side a.item{ padding-left:14px; }
#side i{ width:7px; height:7px; flex:none; } #side i.ok{ background:#2f8a3a; } #side i.bad{ background:var(--accent); }
.search input{ width:100%; font:inherit; font-size:.8rem; padding:6px 8px; border:2px solid var(--edge); background:var(--surface); color:var(--text); }
.sr{ position:absolute; left:-9999px; }
#main:focus{ outline:none; }
#main h1{ font-size:clamp(2rem,6vw,3.4rem); }
.crumbs{ font-size:.76rem; color:var(--muted); margin:0 0 10px; } .crumbs a{ color:var(--muted); }
.stats{ display:flex; gap:28px; margin:20px 0 0; } .stats dt{ font-size:.72rem; color:var(--muted); } .stats dd{ margin:0; font-family:var(--display); font-size:1.8rem; color:var(--heading); }
.sec-head{ display:flex; justify-content:space-between; align-items:baseline; gap:12px; margin-bottom:10px; } .sec-head h2{ margin:0; } .sec-head a{ font-size:.8rem; }
section{ margin-top:40px; }
.grid{ display:grid; grid-template-columns:repeat(auto-fill,minmax(250px,1fr)); gap:16px; }
.card{ display:flex; flex-direction:column; background:var(--surface); border:2px solid var(--edge); box-shadow:4px 4px 0 var(--shadow); padding:12px; color:var(--text); text-decoration:none; transition:transform .1s, box-shadow .1s; }
.card:hover{ transform:translate(-2px,-2px); box-shadow:6px 6px 0 var(--shadow); text-decoration:none; }
.card h3{ font-size:1.1rem; margin:2px 0 4px; } .card p{ margin:0; font-size:.8rem; } .card .io{ margin-top:auto; padding-top:8px; font-size:.72rem; color:var(--muted); }
.thumb{ height:150px; display:flex; align-items:center; justify-content:center; background:var(--bg); border:1px solid var(--line); margin-bottom:10px; overflow:hidden; }
.thumb .stage{ margin:0; }
.title-row{ display:flex; align-items:baseline; justify-content:space-between; gap:12px; flex-wrap:wrap; }
.badge{ font-size:.74rem; border:1px solid var(--line); padding:2px 9px; white-space:nowrap; }
.ok{ color:#2f8a3a; } .bad{ color:var(--accent); } .muted{ color:var(--muted); } .small{ font-size:.74rem; }
.panel{ margin-top:16px; }
.bench{ margin-top:18px; }
.transport, .params, .controls{ display:flex; flex-wrap:wrap; align-items:center; gap:8px 12px; margin:0 0 10px; }
.tick{ margin-left:auto; font-size:.8rem; color:var(--muted); font-variant-numeric:tabular-nums; }
.param{ display:flex; align-items:center; gap:6px; font-size:.76rem; color:var(--muted); }
.param input[type=range]{ width:110px; accent-color:var(--accent); } .param output{ min-width:2ch; color:var(--text); }
.param select{ font:inherit; background:var(--bg); color:var(--text); border:1px solid var(--line); padding:1px 4px; }
.btn.small{ font-size:.76rem; padding:4px 9px; box-shadow:2px 2px 0 var(--shadow); }
.btn[aria-pressed="true"]{ background:var(--accent); color:#fff; }
.btn:disabled{ opacity:.45; cursor:not-allowed; transform:none; }
.scroller{ overflow-x:auto; padding:6px 0; background:var(--bg); border:1px solid var(--line); }
.scroller .stage{ margin:0 auto; }
.cols{ display:grid; grid-template-columns:1fr 1fr; gap:16px; }
.cols .panel{ margin-top:16px; }
.h3{ font-size:1.05rem; margin:0 0 8px; }
.mon{ width:100%; border-collapse:collapse; font-size:.8rem; } .mon th{ text-align:left; color:var(--muted); font-weight:400; padding:3px 10px 3px 0; white-space:nowrap; } .mon td{ padding:3px 0; font-variant-numeric:tabular-nums; }
.mon tr+tr th, .mon tr+tr td{ border-top:1px solid var(--line); }
.log{ list-style:none; margin:0; padding:0; font-size:.76rem; max-height:220px; overflow:auto; } .log li{ padding:2px 0; border-bottom:1px dashed var(--line); } .log span{ color:var(--muted); display:inline-block; min-width:5ch; }
.testlist{ list-style:none; margin:0; padding:0; font-size:.8rem; } .testlist li{ padding:4px 0; } .testlist .st{ display:inline-block; min-width:7ch; font-weight:500; } .testlist code{ font-size:.72rem; }
.spec{ display:grid; grid-template-columns:max-content 1fr; gap:4px 14px; font-size:.8rem; margin:0; } .spec dt{ color:var(--muted); } .spec dd{ margin:0; }
.notes, .rules{ margin:0; padding-left:1.2em; font-size:.85rem; } .rules li{ margin:0 0 8px; max-width:72ch; }
pre{ white-space:pre-wrap; font-size:.74rem; background:var(--bg); border:1px solid var(--line); padding:10px; margin:0; }
.pager{ display:flex; justify-content:space-between; gap:12px; margin-top:26px; font-size:.85rem; }
.toolbar{ display:flex; flex-wrap:wrap; align-items:center; gap:12px; margin:16px 0; font-size:.8rem; }
.table-wrap{ overflow-x:auto; }
.tests-table{ width:100%; border-collapse:collapse; font-size:.82rem; background:var(--surface); border:2px solid var(--edge); }
.tests-table th, .tests-table td{ text-align:left; padding:7px 10px; border-bottom:1px solid var(--line); white-space:nowrap; } .tests-table th{ font-weight:500; color:var(--muted); }
@media (max-width: 860px){
  .menu{ display:inline-block; }
  .layout{ grid-template-columns:minmax(0,1fr); }
  #side{ display:none; position:static; max-height:none; border:2px solid var(--edge); background:var(--surface); padding:10px; }
  body.nav-open #side{ display:block; }
  .cols{ grid-template-columns:1fr; }
}
</style>
</head>
<body>
<a class="skip" href="#main">Skip to content</a>
<canvas id="pearl-sky" aria-hidden="true"></canvas>
<div id="terrain" hidden aria-hidden="true"><p>Downloading terrain</p></div>
<div class="wrap">
  <header class="top">
    <a class="brand" href="#/"><i>RS</i>redstone kit</a>
    <span style="display:flex;align-items:center;gap:14px"><button class="menu" id="menu" type="button" aria-expanded="false" aria-controls="side">Menu</button><span class="rig"><span class="stage" id="theme-stage"></span>lights</span></span>
  </header>
  <nav class="launch" id="launch" aria-label="Main"><div class="launch-scroll"><div class="stage" id="launch-stage"></div></div><p class="launch-hint" id="launch-hint" aria-live="polite">Choose a barrel to launch and teleport.</p></nav>
  <div class="layout">
    <aside id="side" aria-label="Catalogue navigation"></aside>
    <div><div class="measure" id="measure"></div><main id="main" tabindex="-1"></main></div>
  </div>
  <footer><span>Redstone kit · Java-style 3D tick engine · original pixel art</span><a href="#/rules">Engine rules</a></footer>
</div>
<script>/*ENGINE*/</script>
<script>/*DOOR*/</script>
<script>/*SCENES*/</script>
<script>/*PLAQUE*/</script>
<script>/*HIDDEN*/</script>
<script>/*LAUNCHER*/</script>
<script>/*PISTONDOOR*/</script>
<script>/*LOGIC*/</script>
<script>/*CATALOGUE*/</script>
<script>/*RENDER*/</script>
<script>/*CATAPP*/</script>
</body>
</html>
