<section class="demo" data-tag="rs-spinner">
  <p>A loading indicator with <code>role="status"</code>. It runs a real clock, which the page's shared ticker only steps while the spinner is on screen. With reduced motion, or <code>paused</code>, its lever is on and the ring stands still, fully lit.</p>
  <!-- example -->
  <rs-spinner>Loading</rs-spinner>
  <rs-spinner delay="1">Saving</rs-spinner>
  <rs-spinner paused>Paused</rs-spinner>
  <!-- /example -->
</section>
