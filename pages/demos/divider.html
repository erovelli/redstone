<section class="demo" data-tag="rs-divider">
  <p>Use it where you would use <code>&lt;hr&gt;</code>. It fills the width of its container, one block per <code>--rs-block</code>. A plain divider is a quiet world and is never ticked.</p>
  <!-- example -->
  <p>Above the line.</p>
  <rs-divider></rs-divider>
  <p>Between the lines.</p>
  <rs-divider pulse></rs-divider>
  <p>Below the pulse.</p>
  <!-- /example -->
</section>
