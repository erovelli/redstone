<section class="demo" data-tag="rs-tooltip">
  <p>Point at the target, or Tab to it: that stands on the plate and the curtain drops off the signs. Move away and it comes back once the plate releases; Escape dismisses it at once. Use <code>for="id"</code>, or wrap the target and put the tip in <code>tip</code>.</p>
  <!-- example -->
  <button type="button" id="tip-save">Save</button>
  <rs-tooltip for="tip-save">Saves to disk</rs-tooltip>
  <rs-tooltip tip="Ctrl+Z"><button type="button">Undo</button></rs-tooltip>
  <!-- /example -->
</section>
