<section class="demo" data-tag="rs-checkbox">
  <p>A checkbox with native semantics: a checked box submits its <code>value</code>, and <code>required</code> blocks the submit until it is checked. Each press of the stone button toggles the copper bulb.</p>
  <!-- example -->
  <form class="demo-form" action="#">
    <rs-checkbox name="terms" value="yes" required>I agree</rs-checkbox>
    <rs-checkbox name="news" checked>Newsletter</rs-checkbox>
    <rs-checkbox name="beta" disabled>Beta</rs-checkbox>
    <button type="submit">Send</button>
  </form>
  <!-- /example -->
</section>
