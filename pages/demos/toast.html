<section class="demo" data-tag="rs-toast">
  <p>A notification. <code>el.show()</code> (or setting <code>open</code>) presses the show button: the curtain drops and the bell rings; a repeater timer lifts it after <code>duration</code> ms. <code>&lt;rs-alert&gt;</code> is the same machine without the timer, with <code>role="alert"</code>.</p>
  <!-- example -->
  <rs-toast id="saved" duration="3000">Saved. 3 files.</rs-toast>
  <button type="button" onclick="document.getElementById('saved').show()">Show the toast</button>
  <rs-alert open>Disk almost full</rs-alert>
  <!-- /example -->
</section>
