<section class="demo" data-tag="rs-popover">
  <p>Content next to its trigger, opened by a click. The trigger presses the open button (or the close button while the latch is set); the close button in the frame, Escape and a click outside close it. The trigger's <code>aria-expanded</code> follows the door.</p>
  <!-- example -->
  <button type="button">Shipping</button>
  <rs-popover><p>Ships in two days. <a href="#rs-popover">Rates</a></p></rs-popover>
  <!-- /example -->
</section>
