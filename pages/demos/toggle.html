<section class="demo" data-tag="rs-toggle">
  <p>Use it where you would use a checkbox styled as a switch. It is form-associated: with a <code>name</code>, a checked toggle submits its <code>value</code>.</p>
  <!-- example -->
  <rs-toggle name="lights" checked>Lights</rs-toggle>
  <rs-toggle name="fan" length="3">Fan</rs-toggle>
  <rs-toggle name="alarm" disabled>Alarm</rs-toggle>
  <!-- /example -->
</section>
