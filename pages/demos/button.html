<section class="demo" data-tag="rs-button">
  <p>Inside a form it is a submit button by default: the form submits when the lamp lights, not when the pointer goes down. Set <code>type="button"</code> for a plain button.</p>
  <!-- example -->
  <form class="demo-form" action="#">
    <rs-toggle name="newsletter" value="yes">News</rs-toggle>
    <rs-button type="submit">Save</rs-button>
    <rs-button type="reset" wood>Reset</rs-button>
  </form>
  <!-- /example -->
</section>
