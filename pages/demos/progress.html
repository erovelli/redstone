<section class="demo" data-tag="rs-progress">
  <p>Set <code>value</code> (and <code>max</code>, default 100) as you would on a native <code>&lt;progress&gt;</code>; the page's hand puts that many items into the barrel. The bar has <code>steps</code> lamps (default 10), so the value snaps to <code>max / steps</code>. Leave <code>value</code> out for an indeterminate bar: a running torch clock.</p>
  <!-- example -->
  <rs-progress value="7" max="15" steps="15">Copying</rs-progress>
  <rs-progress value="40">Upload</rs-progress>
  <rs-progress>Loading</rs-progress>
  <!-- /example -->
</section>
